name: Python unit tests
# Runs the pytest suite in tests/ against the FastOMA python package.
# Tests marked `slow` only run on the nightly schedule and on manual dispatch.
on:
  push:
    branches:
      - dev
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  pytest:
    # pinned: the golden snapshots of tests/test_fungi30.py need the mafft/FastTree versions of this image
    runs-on: ubuntu-24.04
    name: "pytest | python ${{ matrix.python-version }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # same external tools as the runtime stage of the Dockerfile
      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fasttree mafft mmseqs2
          mafft --version || true
          FastTree -expert 2>&1 | head -1 || true

      - name: Install FastOMA
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        env:
          # fail rather than skip the golden snapshots if the tool versions changed
          FASTOMA_REQUIRE_GOLDEN: "1"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m pytest -ra
          else
            python -m pytest -ra -m "not slow"
          fi
